services:
  discoverer:
    build: .
    command: ["python", "-m", "app.scrapers.run_crawler"]
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-sa.json
    volumes:
      - ./secrets/gcp-sa.json:/secrets/gcp-sa.json:ro
      - ./:/app

  worker:
    build: .
    command: ["python", "-m", "app.harvest.run"]
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-sa.json
      - WORKER_ID=worker-1
    volumes:
      - ./secrets/gcp-sa.json:/secrets/gcp-sa.json:ro
      - ./:/app
